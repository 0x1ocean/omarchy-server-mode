name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install checks
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Validate manifest
        run: bash tests/validate-manifest.sh
      - name: Check helper
        run: bash -n server-mode && shellcheck server-mode tests/helper.test.sh tests/validate-manifest.sh
      - name: Test helper
        run: bash tests/helper.test.sh
      - name: Test model
        run: node tests/model.test.js
